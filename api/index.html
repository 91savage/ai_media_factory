<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Media Factory</title>
    <style>
        :root {
            --bg-color: #0a0a0a;
            --text-color: #f5f5f5;
            --border-color: #333;
            --accent-color: #fff;
            --accent-text: #000;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 500px;
            padding: 2rem;
            box-sizing: border-box;
        }
        h1 {
            font-weight: 600;
            font-size: 2rem;
            letter-spacing: -0.05em;
            margin-bottom: 0.5rem;
        }
        p.subtitle {
            color: #888;
            margin-bottom: 2.5rem;
            font-size: 0.95rem;
        }
        form {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        input[type="text"] {
            background-color: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 1rem;
            font-size: 1rem;
            border-radius: 6px;
            outline: none;
            transition: border-color 0.2s ease;
        }
        input[type="text"]:focus {
            border-color: #666;
        }
        button {
            background-color: var(--accent-color);
            color: var(--accent-text);
            border: none;
            padding: 1rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: opacity 0.2s ease, transform 0.1s ease;
        }
        button:hover {
            opacity: 0.9;
        }
        button:active {
            transform: scale(0.98);
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .status-box {
            margin-top: 2rem;
            padding: 1.25rem;
            border-radius: 6px;
            font-size: 0.9rem;
            display: none;
            border: 1px solid var(--border-color);
            line-height: 1.5;
        }
        .status-box.visible {
            display: block;
            animation: fadeIn 0.3s ease;
        }
        .spinner {
            display: inline-block;
            width: 1rem;
            height: 1rem;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s linear infinite;
            margin-right: 0.5rem;
            vertical-align: middle;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>AI Media Factory</h1>
        <p class="subtitle">Enter a prompt to dispatch a job to the distributed queue.</p>
        
        <form id="generateForm">
            <input type="text" id="promptInput" placeholder="A cinematic shot of a neon city..." required autocomplete="off">
            <button type="submit" id="submitBtn">Generate Image</button>
        </form>

        <div id="statusBox" class="status-box"></div>
    </div>

    <script>
        const form = document.getElementById('generateForm');
        const input = document.getElementById('promptInput');
        const btn = document.getElementById('submitBtn');
        const statusBox = document.getElementById('statusBox');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const prompt = input.value.trim();
            if (!prompt) return;

            // Loading state
            btn.disabled = true;
            btn.innerHTML = 'Transmitting...';
            statusBox.className = 'status-box visible';
            statusBox.innerHTML = '<div class="spinner"></div> Committing to Redis queue...';
            statusBox.style.borderColor = 'var(--border-color)';

            try {
                // Call our FastAPI endpoint
                const response = await fetch(`/generate-image?prompt=${encodeURIComponent(prompt)}`, {
                    method: 'POST'
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    statusBox.innerHTML = `
                        <div style="margin-bottom: 0.5rem"><strong>✅ Dispached Successfully</strong></div>
                        <div style="color: #888; font-family: monospace; font-size: 0.85rem">
                            Task ID: ${data.task_id}<br>
                            Status: ${data.message}
                        </div>
                        <div style="margin-top: 1rem; padding-top: 1rem; border-top: 1px solid #333; color: #aaa;">
                            ⏱️ <em>Check your Telegram notification in 5 seconds.</em>
                        </div>
                    `;
                    input.value = '';
                } else {
                    throw new Error(data.detail || 'Service Error');
                }
            } catch (err) {
                statusBox.innerHTML = `<strong>❌ Error:</strong> ${err.message}`;
                statusBox.style.borderColor = '#ff4a4a';
            } finally {
                // Restore state
                btn.disabled = false;
                btn.innerHTML = 'Generate Image';
            }
        });
    </script>
</body>
</html>
