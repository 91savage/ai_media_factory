apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: ai-media
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
      - name: worker
        image: ai-media-worker:latest
        imagePullPolicy: Never
        env:
        - name: REDIS_HOST
          value: redis-service
        - name: REDIS_PORT
          value: "6379"
        - name: N8N_WEBHOOK_URL
          value: "http://n8n-service:5678/webhook/ai-media-result"
        - name: GEMINI_API_KEY
          valueFrom:
            secretKeyRef:
              name: gemini-secret
              key: GEMINI_API_KEY
