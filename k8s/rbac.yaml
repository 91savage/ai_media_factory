apiVersion: v1
kind: ServiceAccount
metadata:
  name: k8s-waste-scanner-sa
  namespace: ai-media

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k8s-waste-scanner-role
rules:
- apiGroups: [""]
  resources: ["pods", "persistentvolumeclaims"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k8s-waste-scanner-rolebinding
subjects:
- kind: ServiceAccount
  name: k8s-waste-scanner-sa
  namespace: ai-media
roleRef:
  kind: ClusterRole
  name: k8s-waste-scanner-role
  apiGroup: rbac.authorization.k8s.io
