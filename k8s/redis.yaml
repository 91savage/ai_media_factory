apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: ai-media
spec:
  serviceName: "redis-headless"
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
          name: redis
        volumeMounts:
        - name: redis-data
          mountPath: /data
  volumeClaimTemplates:
  - metadata:
      name: redis-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 1Gi

---
# StatefulSet을 위한 Headless Service (ClusterIP: None)
apiVersion: v1
kind: Service
metadata:
  name: redis-headless
  namespace: ai-media
spec:
  clusterIP: None
  selector:
    app: redis
  ports:
  - port: 6379
    targetPort: 6379

---
# API와 Worker가 접근하기 위한 일반 Service (기존과 동일한 이름 유지)
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: ai-media
spec:
  selector:
    app: redis
  ports:
  - port: 6379
    targetPort: 6379
